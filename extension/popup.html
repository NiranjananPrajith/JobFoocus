<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JobFoocus</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #faf7f2;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .header-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Section wrappers */
    .section {
      padding: 14px 16px;
    }
    .section-divider {
      height: 1px;
      background: rgba(0, 0, 0, 0.06);
    }

    /* Primary "Add Job" button */
    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #fa520f;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 120ms ease, transform 80ms ease;
    }
    .add-btn:hover { background: #e54808; }
    .add-btn:active { transform: scale(0.98); }
    .add-btn:disabled {
      background: #c7c2bb;
      cursor: not-allowed;
      transform: none;
    }
    .add-btn svg { flex-shrink: 0; }

    .help {
      margin: 10px 0 0;
      font-size: 12px;
      line-height: 1.45;
      color: #6a6a6a;
      text-align: center;
    }

    /* Status banner — shown after a click action */
    .status {
      display: none;
      margin: 10px 0 0;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }
    .status.is-visible { display: block; }
    .status.is-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* Navigation links (Dashboard, Jobs) */
    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      text-decoration: none;
      color: #3a3a3a;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 100ms ease;
      border: 0;
      background: none;
      width: 100%;
      font-family: inherit;
      text-align: left;
    }
    .nav-link:hover {
      background: rgba(0, 0, 0, 0.05);
    }
    .nav-link:active {
      background: rgba(0, 0, 0, 0.08);
    }
    .nav-link svg {
      flex-shrink: 0;
      color: #8a8a8a;
    }

    /* Account link */
    .account-link {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 500;
      color: #fa520f;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      font-family: inherit;
      margin-top: 10px;
      transition: opacity 100ms ease;
    }
    .account-link:hover { opacity: 0.8; }
    .account-link:active { opacity: 0.65; }
    .account-link svg { flex-shrink: 0; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img src="icons/icon.webp" alt="" class="header-icon" aria-hidden="true" />
    <span class="header-title">JobFoocus</span>
  </div>

  <!-- Section 1: Add Job -->
  <div class="section">
    <button id="add-job" class="add-btn" type="button" aria-label="Add this page as a job to your JobFoocus dashboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span id="add-job-label">Add Job</span>
    </button>
    <p class="help">Imports this page as a tracked job in your dashboard.</p>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>

  <div class="section-divider"></div>

  <!-- Section 2: Navigation -->
  <div class="section">
    <button id="nav-dashboard" class="nav-link" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
      </svg>
      Dashboard
    </button>
    <button id="nav-jobs" class="nav-link" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z" />
      </svg>
      Jobs
    </button>
  </div>

  <div class="section-divider"></div>

  <!-- Section 3: Account -->
  <div class="section">
    <button id="nav-account" class="account-link" type="button">
      Account and Billing
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JobFoocus</title>
  <style>
    /* Reset + base */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #faf7f2;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .header-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #fa520f;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .body {
      padding: 16px;
    }

    /* The "Add Job" primary button. Matches the rest of the
       JobFoocus UI: orange (#fa520f) background, white text, rounded. */
    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #fa520f;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 120ms ease, transform 80ms ease;
    }
    .add-btn:hover { background: #e54808; }
    .add-btn:active { transform: scale(0.98); }
    .add-btn:disabled {
      background: #c7c2bb;
      cursor: not-allowed;
      transform: none;
    }
    .add-btn svg { flex-shrink: 0; }

    .help {
      margin: 10px 0 0;
      font-size: 12px;
      line-height: 1.45;
      color: #6a6a6a;
      text-align: center;
    }

    /* Status banner — only shown after a click, briefly, before the
       popdown closes. Confirms the action is in flight. */
    .status {
      display: none;
      margin: 10px 0 0;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }
    .status.is-visible { display: block; }
    .status.is-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon" aria-hidden="true">J</span>
    <span class="header-title">JobFoocus</span>
  </div>

  <div class="body">
    <button id="add-job" class="add-btn" type="button" aria-label="Add this page as a job to your JobFoocus dashboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span id="add-job-label">Add Job</span>
    </button>

    <p class="help">Imports this page as a tracked job in your dashboard.</p>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
